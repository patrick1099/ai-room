[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-room"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ai-room = "ai_room.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not contract'"
pythonpath = ["src"]
markers = [
    "contract: runs one real vendor CLI end-to-end (deselected by default)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_room = ["resources/*.md"]
